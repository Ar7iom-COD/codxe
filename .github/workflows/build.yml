name: Build and Release
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Is this a pre-release?"
        required: true
        type: boolean
        default: false

# Add permissions needed for creating releases
permissions:
  contents: write
  pull-requests: write

jobs:
  install:
    runs-on: windows-2022 # windows-latest fails, pinning for now
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper commit counting

      - name: Download Visual Studio 2010 Ultimate (from private mirror)
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          gh release download v1 `
            --repo Ar7iom-COD/codxe-build-deps `
            --pattern "vs2010_ultimate.iso" `
            --output vs2010_ultimate.iso
        shell: pwsh

      - name: Mount ISO and Install Visual Studio 2010 Ultimate
        run: |
          # Mount the ISO
          $mountResult = Mount-DiskImage -ImagePath "$env:GITHUB_WORKSPACE\vs2010_ultimate.iso" -PassThru
          $driveLetter = ($mountResult | Get-Volume).DriveLetter
          # Install VCExpress
          Write-Host "Installing VCExpress from ${driveLetter}:\Setup\setup.exe"
          $process = Start-Process -FilePath "${driveLetter}:\Setup\setup.exe" -ArgumentList "/q /norestart" -Wait -PassThru
          # Check installation result
          if ($process.ExitCode -eq 3010) {
            Write-Host "Installation completed but requires a reboot. Continuing without reboot."
          } elseif ($process.ExitCode -ne 0) {
            Write-Host "Installation failed with exit code: $($process.ExitCode)"
            exit $process.ExitCode
          }
          # Unmount the ISO
          Dismount-DiskImage -ImagePath "$env:GITHUB_WORKSPACE\vs2010_ultimate.iso"
        shell: pwsh

      - name: Download Xbox 360 SDK (from private mirror)
        env:
          GH_TOKEN: ${{ secrets.DEPS_PAT }}
        run: |
          gh release download v1 `
            --repo Ar7iom-COD/codxe-build-deps `
            --pattern "xbox360_sdk.zip" `
            --output xbox360_sdk.zip
          Expand-Archive -Path xbox360_sdk.zip -DestinationPath .
        shell: pwsh

      - name: Install Xbox 360 SDK
        run: |
          Start-Process -FilePath "XBOX360 SDK 21256.3.exe" -ArgumentList "/U", "/T full" -Wait
        shell: pwsh

      - name: Build Plugin
        id: build
        run: |
          # Get commit count
          $commitCount = git rev-list --count HEAD
          echo "BUILD_NUMBER=$commitCount" >> $env:GITHUB_OUTPUT
          # Build using build.py which will use the same commit count
          python build.py
          echo "ZIP_FILE=codxe-r${commitCount}.zip" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: r${{ steps.build.outputs.BUILD_NUMBER }}
          name: r${{ steps.build.outputs.BUILD_NUMBER }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            build/${{ steps.build.outputs.ZIP_FILE }}
            build/Release/bin/codxe.xex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
